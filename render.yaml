services:
  - type: web
    name: jobfit-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        value: "*"
        # Set this to your deployed frontend URL after Vercel deploy,
        # e.g. https://jobfit-ai.vercel.app
      - key: PYTHON_VERSION
        value: "3.11.9"