services:
  - type: web
    name: jobfit-ai-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: "https://jobfit-ai-steel.vercel.app"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SUPABASE_URL
        value: "https://aydkndeqhwsueybrllzw.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-2
      - key: HF_TOKEN
        sync: false # secret: paste the value in the Render dashboard, never commit it
